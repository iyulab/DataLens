name: Publish NuGet

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:

env:
  PACKAGE_NAME: DataLens

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Changelog has an entry for this version
        run: bash scripts/check-changelog-entry.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Read version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # This workflow is triggered by any change to Directory.Build.props, not
      # only by a version bump — that file also carries build and audit
      # settings. Without this check a settings-only edit re-runs the publish
      # against a version that is already released: the push itself is a no-op
      # thanks to --skip-duplicate, but tagging then fails on the existing tag
      # and reports the whole release as broken. Ask the registry what is
      # actually published rather than inferring it from which file changed.
      - name: Check if this version is already published
        id: gate
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_LOWER=$(echo "${{ env.PACKAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/${PKG_LOWER}/${VERSION}/${PKG_LOWER}.nuspec")
          if [ "$HTTP" = "200" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "${{ env.PACKAGE_NAME }} ${VERSION} already on nuget.org — skipping publish"
          elif [ "$HTTP" = "404" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "${{ env.PACKAGE_NAME }} ${VERSION} not on nuget.org (HTTP ${HTTP}) — will publish"
          else
            echo "::error::the registry answered HTTP ${HTTP}, so it is unknown whether this version is published; re-run once the registry responds"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity minimal

      - name: Pack
        if: steps.gate.outputs.should_publish == 'true'
        run: dotnet pack -c Release --no-build -o ./nupkg

      # Trusted publishing: a short-lived key from the repository's OIDC token. The long-lived
      # NUGET_API_KEY stays as the fallback until one release has gone through the login step.
      - name: NuGet login (trusted publishing)
        id: login
        if: steps.gate.outputs.should_publish == 'true'
        continue-on-error: true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Warn when falling back to the long-lived key
        if: steps.gate.outputs.should_publish == 'true' && steps.login.outcome != 'success'
        run: echo "::warning::NuGet trusted-publishing login failed; pushing with NUGET_API_KEY"

      - name: Push to NuGet
        if: steps.gate.outputs.should_publish == 'true'
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create Git tag
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
