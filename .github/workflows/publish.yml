name: Publish NuGet

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:

env:
  PACKAGE_NAME: DataLens

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Read version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # This workflow is triggered by any change to Directory.Build.props, not
      # only by a version bump — that file also carries build and audit
      # settings. Without this check a settings-only edit re-runs the publish
      # against a version that is already released: the push itself is a no-op
      # thanks to --skip-duplicate, but tagging then fails on the existing tag
      # and reports the whole release as broken. Ask the registry what is
      # actually published rather than inferring it from which file changed.
      - name: Check if this version is already published
        id: gate
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_LOWER=$(echo "${{ env.PACKAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/${PKG_LOWER}/${VERSION}/${PKG_LOWER}.nuspec")
          if [ "$HTTP" = "200" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "${{ env.PACKAGE_NAME }} ${VERSION} already on nuget.org — skipping publish"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "${{ env.PACKAGE_NAME }} ${VERSION} not on nuget.org (HTTP ${HTTP}) — will publish"
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity minimal

      - name: Pack
        if: steps.gate.outputs.should_publish == 'true'
        run: dotnet pack -c Release --no-build -o ./nupkg

      - name: Push to NuGet
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create Git tag
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
